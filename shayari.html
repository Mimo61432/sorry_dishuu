<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For My Shehzadi</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Quicksand:wght@600&display=swap" rel="stylesheet">
<style>
:root{--dusty:#9E475B;--ink:#2C1820;--radius:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative;
background:radial-gradient(ellipse at 15% 10%,#FFE9DC 0,transparent 45%),radial-gradient(ellipse at 90% 90%,#E4D4F4 0,transparent 55%),linear-gradient(135deg,#FBD3DF,#FDE8F0 45%,#F3E5F5 75%,#DCCBF2);
transition:opacity .9s ease}
body.out{opacity:0}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;border-radius:140% 0 140% 0;background:linear-gradient(135deg,#FFC4D3,#EE8FAA 70%,#E0708F);animation:drift linear infinite}
@keyframes drift{from{transform:translate(0,-12vh) rotate(0)}to{transform:translate(var(--dx),115vh) rotate(var(--rot))}}
.sp{position:absolute;color:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.bot{position:fixed;bottom:0;height:min(62vh,430px);width:auto;opacity:.5;pointer-events:none;z-index:0}
.bot.l{left:-10px}.bot.r{right:-10px;transform:scaleX(-1)}
.card{position:relative;z-index:1;width:min(760px,100%);padding:clamp(34px,6vw,58px) clamp(20px,6vw,70px) clamp(34px,5vw,46px);text-align:center;border-radius:var(--radius);
background:rgba(255,255,255,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,.95);
box-shadow:inset 0 0 0 7px rgba(255,255,255,.22),inset 0 0 30px rgba(255,255,255,.75),0 24px 70px rgba(217,128,149,.32);animation:float 1.5s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:-9px;border-radius:calc(var(--radius) + 9px);border:1px solid rgba(255,255,255,.65);pointer-events:none}
@keyframes float{from{opacity:0;transform:translateY(46px) scale(.96)}to{opacity:1;transform:none}}
h1{font-family:'Great Vibes',cursive;font-weight:400;color:var(--dusty);font-size:clamp(2.7rem,9vw,4rem);margin-bottom:clamp(18px,3vw,30px);line-height:1.1}
.st{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink);font-size:clamp(1.05rem,3.8vw,1.35rem);line-height:1.7;margin-bottom:clamp(16px,3vw,26px);opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
.st.show{opacity:1;transform:none}
.btn{margin-top:6px;border:0;cursor:pointer;padding:13px 34px;border-radius:999px;font:600 1rem 'Quicksand',sans-serif;color:#fff;letter-spacing:.3px;
background:linear-gradient(180deg,#E9A3B5,#D4778E);box-shadow:0 6px 20px rgba(212,119,142,.55),0 0 24px rgba(240,150,175,.55),inset 0 1px 0 rgba(255,255,255,.5);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity 1s,transform .3s,box-shadow .3s}
.btn.show{opacity:1;pointer-events:auto;transform:none}
.btn.show:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 28px rgba(212,119,142,.7),0 0 38px rgba(240,150,175,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.heart{position:fixed;font-size:22px;pointer-events:none;z-index:9;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div id="bg"></div>
<main class="card">
  <h1>For My Shehzadi</h1>
  <p class="st">Waqt ki bhaag-daud mein kuch aise ulajh gaya,<br>Jise har pal chaha, usi ko waqt dene mein chook gaya...</p>
  <p class="st">Shehzadiyon ki tarah rakhna tha tujhe apni palkon par,<br>Main naadaan apni hi duniya ki masroofiyat mein kho gaya...</p>
  <p class="st" id="s3"></p>
  <button class="btn" id="go">Forgive Me 🤍</button>
</main>
<script>
// Her name before "galti meri hai". Set to "" to remove it.
const HER_NAME = "Dishuu";

document.getElementById('s3').innerHTML =
  (HER_NAME ? HER_NAME + ", galti" : "Galti") + " meri hai, par saza hamari mohabbat ko mat dena,<br>Apne is gunehgaar ko ek baar phir apna waqt lutane ka mauka de dena.";

// botanical line-art (left & right)
function branch(){
  let s='<svg viewBox="0 0 200 420" fill="none" stroke="#B86A80" stroke-width="1.4" stroke-linecap="round">';
  s+='<path d="M20 420C30 330 60 250 120 170S170 60 160 10"/><path d="M60 420C70 360 100 320 150 280"/>';
  const L=[[28,380,-40],[40,330,30],[58,285,-50],[80,240,35],[104,200,-55],[130,160,30],[150,115,-45],[160,70,25],[156,30,-30],[66,380,35],[100,340,-40],[130,305,30]];
  L.forEach(([x,y,r])=>{s+=`<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0 0C14-16 34-16 46 0 34 16 14 16 0 0z"/><path d="M0 0L40 0" stroke-width=".8"/></g>`});
  return s+'</svg>';
}
document.body.insertAdjacentHTML('beforeend',branch().replace('<svg','<svg class="bot l"')+branch().replace('<svg','<svg class="bot r"'));

// petals + sparkles
const bg=document.getElementById('bg');
for(let i=0;i<22;i++){const p=document.createElement('div');p.className='petal';const s=18+Math.random()*42;
p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*.85}px;opacity:${.45+Math.random()*.4};filter:blur(${(Math.random()*2.5+.5).toFixed(1)}px);--dx:${(Math.random()-.5)*260}px;--rot:${300+Math.random()*500}deg;animation-duration:${22+Math.random()*22}s;animation-delay:${-Math.random()*40}s`;bg.appendChild(p);}
for(let i=0;i<14;i++){const s=document.createElement('div');s.className='sp';s.textContent='✦';
s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;font-size:${8+Math.random()*10}px;animation-delay:${Math.random()*3}s`;bg.appendChild(s);}

// stagger
const sts=[...document.querySelectorAll('.st')];
sts.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),1700+i*1200));
const btn=document.getElementById('go');
setTimeout(()=>btn.classList.add('show'),1700+sts.length*1200+300);

btn.addEventListener('click',()=>{
  const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<28;i++){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','💖','🤍','💗'][i%4];
  const a=Math.random()*6.28,d=60+Math.random()*150;
  h.style.cssText=`left:${cx}px;top:${cy}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;document.body.appendChild(h);}
  setTimeout(()=>document.body.classList.add('out'),700);
  setTimeout(()=>location.href='forgive.html',1600);
});
</script>
</body>
</html>
