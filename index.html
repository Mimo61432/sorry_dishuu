<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Am Really So Sorry, My Princess 👑</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Fredoka (Bold Rounded Heading) & Quicksand (Soft Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --plum-dark: #6D2E46;
            --plum-text: #4A2535;
            --rose-border: #D88C9A;
            --pink-glow: rgba(255, 107, 149, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Quicksand', sans-serif;
            color: var(--plum-text);
            /* Exact Soft Pastel Pink, Cream & Lavender Mesh Gradient */
            background-color: #FFF9F5;
            background-image: 
                radial-gradient(at 12% 18%, #FDEEF4 0px, transparent 55%),
                radial-gradient(at 88% 22%, #F3E5F5 0px, transparent 55%),
                radial-gradient(at 50% 50%, #FFF0F5 0px, transparent 65%),
                radial-gradient(at 20% 85%, #FFF9F5 0px, transparent 55%),
                radial-gradient(at 85% 88%, #F8E8F8 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Rounded Display Typography */
        .font-heading {
            font-family: 'Fredoka', sans-serif;
            color: var(--plum-dark);
            letter-spacing: -0.01em;
        }

        /* Double Soft-Rose Border Avatar Frame */
        .avatar-outer-ring {
            width: 168px;
            height: 168px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 4.5px solid #D88C9A;
            padding: 6px;
            box-shadow: 
                0 14px 35px rgba(109, 46, 70, 0.12),
                0 0 0 6px rgba(255, 255, 255, 0.65);
            position: relative;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .avatar-outer-ring:hover {
            transform: scale(1.03);
        }

        .avatar-inner-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #F3C6D0;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at 50% 35%, #FCE4EC 0%, #F3D1DC 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Tilted Royal Crown Perched on Top-Left */
        .crown-badge {
            position: absolute;
            top: -36px;
            left: -22px;
            width: 86px;
            height: 86px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 6px 10px rgba(109, 46, 70, 0.16));
            animation: crownFloat 3.6s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0px) rotate(-22deg); }
            50% { transform: translateY(-5px) rotate(-18deg); }
        }

        /* Dashed Pill Badge ("yes u, My Princess") */
        .princess-pill {
            background: linear-gradient(180deg, #FDE8F0 0%, #FADCE8 100%);
            border: 2px dashed var(--rose-border);
            border-radius: 9999px;
            padding: 8px 30px;
            color: var(--plum-dark);
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(216, 140, 154, 0.18);
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .princess-pill:hover {
            transform: scale(1.04);
        }

        /* Glowing Pill-Shaped Gradient CTA Button */
        .cta-heart-btn {
            position: relative;
            background: linear-gradient(180deg, #FF94B2 0%, #FF6B95 50%, #F85784 100%);
            color: #FFFFFF;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            border: 2.5px solid rgba(255, 215, 228, 0.9);
            border-radius: 9999px;
            padding: 15px 46px;
            font-size: 1.2rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 
                0 10px 28px var(--pink-glow),
                0 0 22px rgba(255, 118, 158, 0.45),
                inset 0 2px 3px rgba(255, 255, 255, 0.65);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .cta-heart-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 16px 36px rgba(255, 92, 138, 0.68),
                0 0 32px rgba(255, 118, 158, 0.65),
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .cta-heart-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Subtle Floating & Twinkling Animations for Decorative Elements */
        .float-slow {
            animation: floatSlow 4.5s ease-in-out infinite;
        }
        .float-delayed {
            animation: floatSlow 5.2s ease-in-out 1.5s infinite;
        }
        .twinkle {
            animation: twinklePulse 3s ease-in-out infinite;
        }
        .twinkle-delayed {
            animation: twinklePulse 3.8s ease-in-out 1.4s infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }

        @keyframes twinklePulse {
            0%, 100% { opacity: 0.45; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* Smooth Page Exit Transition */
        .page-wrapper {
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .page-wrapper.fade-out {
            opacity: 0;
            transform: translateY(-18px) scale(0.98);
        }
    </style>
</head>
<body>

    <!-- =====================================================================

        </svg>

    </div>

    <!-- =====================================================================
         JAVASCRIPT: SUBTLE SPARKLE GENERATOR & SMOOTH PAGE TRANSITION
    ====================================================================== -->
    <script>
        // 1. Generate subtle tiny background dots & sparkles matching the mockup
        const sparkleContainer = document.getElementById('ambientSparkles');
        const dotColors = ['#FFFFFF', '#E6A8B8', '#C89EB8', '#F4C2D7'];

        for (let i = 0; i < 18; i++) {
            const dot = document.createElement('div');
            const size = Math.random() * 4 + 3; // 3px to 7px
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            dot.style.borderRadius = '50%';
            dot.style.backgroundColor = dotColors[Math.floor(Math.random() * dotColors.length)];
            dot.style.position = 'absolute';
            dot.style.top = `${Math.random() * 90 + 5}%`;
            dot.style.left = `${Math.random() * 90 + 5}%`;
            dot.style.opacity = Math.random() * 0.55 + 0.25;
            dot.style.animation = `twinklePulse ${Math.random() * 3 + 2.5}s ease-in-out ${Math.random() * 2}s infinite`;
            sparkleContainer.appendChild(dot);
        }

        // 2. Smooth Heart Burst & Page Transition to Page 2 (shayari.html)
        function handleNextPage(event, targetUrl) {
            event.preventDefault();
            const btn = document.getElementById('readHeartBtn');
            const rect = btn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Spawn a gentle burst of pastel hearts from the button
            const heartColors = ['#FF6B95', '#FF94B2', '#6D2E46', '#F7A1B5', '#FFD1DC'];
            for (let i = 0; i < 16; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.style.position = 'fixed';
                heart.style.left = `${centerX}px`;
                heart.style.top = `${centerY}px`;
                heart.style.color = heartColors[i % heartColors.length];
                heart.style.fontSize = `${Math.random() * 12 + 14}px`;
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '50';
                heart.style.transition = 'transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s ease-out';
                document.body.appendChild(heart);

                const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.4;
                const dist = Math.random() * 90 + 45;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist - 20;

                requestAnimationFrame(() => {
                    heart.style.transform = `translate(${tx}px, ${ty}px) scale(1.25)`;
                    heart.style.opacity = '0';
                });

                setTimeout(() => heart.remove(), 800);
            }

            // Smoothly fade out the hero page, then navigate to shayari.html
            const heroPage = document.getElementById('heroPage');
            heroPage.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 600);
        }
